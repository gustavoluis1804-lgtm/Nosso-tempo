plugins { id 'com.android.application' }

android {
    namespace 'br.com.gustavo.nossotempo'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.gustavo.nossotempo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
